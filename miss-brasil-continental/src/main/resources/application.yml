spring:
  application:
    name: miss-brasil-continental

  datasource:
    url: jdbc:h2:mem:missbrasildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
